history_sink: history.jsonl
tasks:
  - name: local-snmp
    interval: 1s
    limit: 0
    attempt_config:
      timeout: 1s
      retries: 1
      retry_delay: 200ms
    query:
      query_type: snmpget
      host: 127.0.0.1
      port: 161
      community: public
      oids:
        - name: sysDescr
          oid: 1.3.6.1.2.1.1.1.0
