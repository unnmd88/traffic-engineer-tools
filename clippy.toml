
too_many_arguments_threshold = 10
type_complexity_threshold = 250
enum_variant_name_threshold = 3
struct_field_name_threshold = 3
large_enum_variant_threshold = 100
[clippy.lints]
pedantic = "warn"
nursery = "warn"
cargo = "warn"
# Отключаем слишком строгие
clippy::module_name_repetitions = "allow"
clippy::must_use_candidate = "allow"
clippy::missing_errors_doc = "allow"
